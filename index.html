<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Trên Android (box, máy tính bảng) màn hình CSS hẹp: hiển thị theo bề rộng 1600 px như trên máy tính rồi thu vừa màn hình
// Chế độ tủ điều khiển (màn hình 1920×1080 / TV): dàn trang đúng 1920 px
(function () {
  let k = null; try { k = localStorage.getItem('hpsKiosk'); } catch (e) { }
  const kiosk = /[?&]kiosk=1/.test(location.search) || (k === null ? !!window.HpsApp : k === '1');
  const w = kiosk ? 1920 : 1600;
  if (/Android/i.test(navigator.userAgent) && Math.max(screen.width, window.innerWidth) < w - 100)
    document.querySelector('meta[name=viewport]').setAttribute('content', 'width=' + w);
})();
</script>
<title>NMTĐ Đray H'Linh 2 — Mô phỏng SCADA &amp; 3D</title>
<meta name="description" content="Mô phỏng vận hành Nhà máy Thủy điện Đray H'Linh 2 chạy độc lập trên trình duyệt (SCADA, 3D, bảo vệ rơ le, tự chấm điểm)." />
<meta property="og:title" content="NMTĐ Đray H'Linh 2 — Mô phỏng SCADA &amp; 3D" />
<meta property="og:description" content="Mô phỏng vận hành Nhà máy Thủy điện Đray H'Linh 2 chạy độc lập trên trình duyệt (SCADA, 3D, bảo vệ rơ le, tự chấm điểm)." />
